<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GitHub Developer Analyzer</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <div class="container">

    <div class="controls">
      <input id="userA" placeholder="User A (e.g. torvalds)" />
      <input id="userB" placeholder="User B (e.g. gaearon)" />
      <button id="compare">Compare</button>
    </div>

    <div id="status"></div>
    <div id="error"></div>

    <div id="result"></div>

  </div>

  <script src="api.js"></script>
  <script src="analyzer.js"></script>
  <script src="ui.js"></script>
  <script src="main.js"></script>

</body>
</html>
